[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=VIBH2O
Description=Installation VIBH2O — bulles cardiaques pilotees en OSC depuis Max/MSP.

; ---------------------------------------------------------------------------
; Reglages du plugin VibH2O.
;
; Ils sont aussi editables dans Project Settings > Plugins > VibH2O. Les
; valeurs ci-dessous sont celles constatees sur le patch Max de reference ;
; celles marquees "a confirmer" attendent une verification en salle.
; ---------------------------------------------------------------------------
[/Script/VibH2O.VibH2OSettings]
ListenAddress=0.0.0.0
ListenPort=9002
bAutoStartReceiver=True

RoomMappingPrefix=/RoomMapping
ColumnsSegment=columns
RowsSegment=rows
BpmPrefix=/BPM
; A confirmer sur le patch : le textedit correspondant n'a pas ete retrouve.
ExcitationPrefix=/SD
; Le textedit de VIBH2O_Mapping.maxpat affiche "/Synchronie", pas "/Sync".
SynchronyPrefix=/Synchronie
; Entree cablee mais inutilisee : Max n'envoie pas les battements aujourd'hui.
BeatPrefix=/Beat
EffectPrefix=/Effect
BlendPrefix=/Blend
FocusGroupPrefix=/Focus/Group
FocusAmountPrefix=/Focus/Amount

RoomMappingSettleSeconds=0.100000
; Valeur lue dans Scripts/FormatRoomMapping.js du depot VibH2o :
; index = (x * rows + y) + 1, ou x est la colonne.
SeatOrder=ColumnMajor
+EmptySeatIds=0
+EmptySeatIds=999
IndividualIdOffset=0
; Faux : un index absent de la rafale est du silence (paquet perdu), pas un
; effacement. Le protocole annonce toujours une place libre par 0 ou 999.
bTreatMissingSeatsAsEmpty=False

StaleTimeoutSeconds=5.000000
MinBpm=25.000000
MaxBpm=220.000000
ExcitationInputMin=0.000000
ExcitationInputMax=1.000000
SynchronyInputMin=0.000000
SynchronyInputMax=1.000000
ValueSmoothingSeconds=0.150000
BeatPulseDecaySeconds=0.350000
