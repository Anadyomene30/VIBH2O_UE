-size="12" text-anchor="start" fill="#333" font-weight="normal" font-family="Arial, sans-serif">Cour à droite du public, jardin à gauche. Côté jardin = côté des rideaux rouges des gradins</text><text x="897.5" y="731.0" font-size="12" text-anchor="start" fill="#333" font-weight="normal" font-family="Arial, sans-serif">  (si le scan n’est pas en miroir — à confirmer d’un coup d’œil en salle).</text><text x="897.5" y="749.0" font-size="12" text-anchor="start" fill="#333" font-weight="normal" font-family="Arial, sans-serif">Les deux tulles du fond ne sont pas symétriques : centres à 2,05 m (jardin) et 2,65 m (cour).</text></svg>